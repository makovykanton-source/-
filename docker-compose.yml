version: '3.9'
services:
  api:
    build: .
    command: node dist/src/main.js
    env_file: .env.example
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - postgres
      - redis

  bot:
    build: .
    command: node dist/src/bot/main.js
    env_file: .env.example
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: node dist/src/workers/main.js
    env_file: .env.example
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: discord_shield
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
